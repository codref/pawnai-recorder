plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.pawnai.recorder'
    compileSdk androidCompileSdk
    buildToolsVersion "37.0.0"

    defaultConfig {
        applicationId "com.pawnai.recorder"
        minSdk androidMinSdk
        targetSdk androidCompileSdk
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    // Prefer SDK NDK; fall back to project-local install under android/.android-sdk/
    def ndkVer = "27.0.12077973"
    ndkVersion ndkVer
    def localNdk = file("${rootDir}/.android-sdk/ndk/${ndkVer}")
    if (localNdk.exists()) {
        ndkPath localNdk.absolutePath
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(17)
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        freeCompilerArgs.addAll(
                '-opt-in=androidx.compose.material3.ExperimentalMaterial3Api',
                '-opt-in=androidx.compose.animation.ExperimentalAnimationApi',
                '-opt-in=com.google.accompanist.permissions.ExperimentalPermissionsApi',
                '-opt-in=androidx.compose.ui.ExperimentalComposeUiApi',
        )
    }
}

dependencies {
    implementation "androidx.activity:activity-compose:${activityComposeVersion}"
    implementation "androidx.compose.ui:ui:$composeUiVersion"
    implementation "androidx.compose.ui:ui-tooling-preview:$composeUiVersion"
    implementation "androidx.compose.material3:material3:${material3Version}"
    implementation "androidx.compose.material3:material3-window-size-class:1.3.1"
    implementation "androidx.compose.material:material-icons-extended:$composeUiVersion"

    implementation "androidx.lifecycle:lifecycle-runtime-ktx:${lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:${lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-service:${lifecycleVersion}"

    implementation "androidx.datastore:datastore-preferences:${datastoreVersion}"

    implementation "com.google.accompanist:accompanist-permissions:${accompanistVersion}"
    implementation "com.google.accompanist:accompanist-systemuicontroller:$accompanistVersion"

    implementation "io.github.raamcosta.compose-destinations:core:$destinationsVersion"
    ksp "io.github.raamcosta.compose-destinations:ksp:$destinationsVersion"

    implementation platform("aws.sdk.kotlin:bom:${awsSdkKotlinBom}")
    implementation "aws.sdk.kotlin:s3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation "org.jetbrains.kotlin:kotlin-reflect:${kotlinVersion}"

    implementation "dev.pawnai:pawn-queue:0.1.0"

    testImplementation "junit:junit:${junitVersion}"
    testImplementation("org.assertj:assertj-core:${assertJVersion}")
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutinesVersion"
    testImplementation "androidx.arch.core:core-testing:${coreTestingVersion}"
    testImplementation "app.cash.turbine:turbine:${turbineVersion}"

    debugImplementation "androidx.compose.ui:ui-tooling:$composeUiVersion"
}
